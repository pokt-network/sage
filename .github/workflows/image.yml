name: Image

# On-demand container image from any branch, for a canary or a test cluster.
# Release images stay tag-driven (release.yml); this never moves `latest`.
# The image is tagged <branch>-<short sha> (or the tag given as input) and
# also with the bare short sha, so what a cluster runs is traceable to a
# commit without anyone reading a manifest, and a commit maps to its image.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: <branch>-<short sha>)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            branch="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
            tag="${branch}-${GITHUB_SHA::7}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image: ghcr.io/${{ github.repository }}:${tag} (also :${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            COMMIT=${{ github.sha }}
          # Two names for one image: the readable one, and the bare short
          # sha so anything that knows a commit can find its image.
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.sha }}
